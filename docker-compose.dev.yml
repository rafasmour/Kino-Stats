services:
  kino-api:
    build:
      context: ./api
      dockerfile: ./Dockerfile
    env_file: ".env"
    labels:
      - traefik.enable=true
      - traefik.http.routers.kino-api.rule=Host(`kino.${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.kino-api.entrypoints=websecure
      - traefik.http.services.kino-api.loadbalancer.server.port=80
      - traefik.http.routers.kino-api.tls=true

    networks:
      - webgateway
    volumes:
      - ./api:/api

networks:
  webgateway:
    name: ${NETWORK}
    external: true